name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # The core is plain net10.0: build and test it on Linux too, so it stays portable (ADR 0002).
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Format check
        run: dotnet format whitespace --verify-no-changes tests/SpreadsheetEditor.Core.Tests/SpreadsheetEditor.Core.Tests.csproj
      - name: Build and test
        run: dotnet test tests/SpreadsheetEditor.Core.Tests -c Release

  app:
    name: App (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish (x64) and smoke run
        shell: pwsh
        run: ./build.ps1 -Smoke
      - name: Build (ARM64)
        shell: pwsh
        run: dotnet build src/SpreadsheetEditor.App -c Release -r win-arm64 -p:Platform=ARM64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SpreadsheetEditor-win-x64
          path: out/app
          retention-days: 7
